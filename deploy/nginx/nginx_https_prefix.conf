# ghproxy 反向代理示例：HTTPS + /ghproxy/ 前缀
#
# 客户端地址形如：
#   https://cache.corp/ghproxy/https://github.com/owner/repo/releases/download/v1/file
#
# 用法：
#   1. 先把 nginx_ghproxy_common.conf 装到 /etc/nginx/conf.d/00-ghproxy-common.conf
#   2. 本文件放到 /etc/nginx/conf.d/ghproxy.conf（该文件被 include 进 http {} 块）
#   3. 修改 server_name 与证书路径
#   4. nginx -t && systemctl reload nginx
#
# 前提：ghproxy 监听 127.0.0.1:18080。
# 本文件只包含站点部分；upstream ghproxy_backend 与 map $ghproxy_uri 定义在
# nginx_ghproxy_common.conf 里，同一台 nginx 只装一份，多个站点共用。

# HTTP -> HTTPS。$request_uri 保留 /ghproxy/ 前缀，跳转后路径不变。
server {
    listen 80;
    server_name cache.corp;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # nginx >= 1.25.1 用下面的 http2 on;；旧版本改成 listen 443 ssl http2;
    # http2 on;
    server_name cache.corp;

    ssl_certificate     /etc/nginx/tls/cache.corp.crt;
    ssl_certificate_key /etc/nginx/tls/cache.corp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ghproxy_tls:10m;
    ssl_session_timeout 1h;

    # 自签或内部 CA 时不要开 HSTS，否则证书出问题无法回退
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 可选：只允许内网访问
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    # 这里不需要 merge_slashes off：map 转发的是原始 $request_uri，双斜杠不会
    # 被规范化。注意该指令只允许出现在 http/server 级，不能写进 location；
    # 若改成 proxy_pass 尾斜杠形式，必须在 server 级加回 merge_slashes off;
    location /ghproxy/ {
        # 末尾不要加 /，前缀已由 map 去掉
        proxy_pass http://ghproxy_backend$ghproxy_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件流式转发：不要让 nginx 缓冲到临时文件，
        # 否则几 GB 的 Release 会先落盘，下载进度也会卡住。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;

        # 大文件 / 慢链路
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        client_max_body_size 0;
    }
}
