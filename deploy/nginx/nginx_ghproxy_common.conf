# ghproxy 公共定义：upstream + map
#
# 这两个都是 http 级指令，必须放在 server {} 外面。
# 安装为 /etc/nginx/conf.d/00-ghproxy-common.conf 即可：该目录已被 include 进
# http {}，站点文件里不要再写 include，也不要重复定义 —— 同一台 nginx 只能有
# 一份，重复会触发 duplicate upstream / 变量重复的启动错误。
#
# 多个站点共用时只装这一份，各站点文件里只保留 location ^~ /ghproxy/。

upstream ghproxy_backend {
    server 127.0.0.1:18080;
    keepalive 32;
}

# 剥掉 /ghproxy 前缀，其余原样转发。
#
# 用 $request_uri（原始请求行）而不是 proxy_pass 的尾斜杠形式：后者会让 nginx
# 先规范化 URI，把 /https:// 合并成 /https:/，还会把 %2F 解码成 /。
# 用 map + $request_uri 时双斜杠、百分号编码、查询串都保持原样。
# merge_slashes 只能在 http/server 级设置，不能写进 location；这里不需要它。
map $request_uri $ghproxy_uri {
    "~^/ghproxy(?<rest>/.*)$" $rest;
}
