# ghproxy 反向代理示例
#
# 用法：
#   1. 放到 /etc/nginx/conf.d/ghproxy.conf（或 include 进 http {} 块）
#   2. 按需修改 server_name 和监听端口
#   3. nginx -t && systemctl reload nginx
#
# 前提：ghproxy 容器把端口发布到 127.0.0.1:18080。
# 如果 nginx 与 ghproxy 在同一个 compose 网络里，把 upstream 改成
#   server ghproxy:8080;
# 并去掉宿主机端口映射。

upstream ghproxy_backend {
    server 127.0.0.1:18080;
    keepalive 32;
}

server {
    listen 80;
    server_name cache.corp;

    # 必须：前缀式 URL 形如 /https://github.com/...
    # nginx 默认 merge_slashes on 会把 // 合并成 /，变成 /https:/github.com/...
    # 导致代理返回 400。
    merge_slashes off;

    # 可选：只允许内网访问
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    location / {
        # 末尾不要加 /，否则会丢掉 location 前缀，路径变成 /github.com/...
        proxy_pass http://ghproxy_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件流式转发：不要让 nginx 缓冲到临时文件，
        # 否则几 GB 的 Release 会先落盘，下载进度也会卡住。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;

        # 大文件 / 慢链路
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        client_max_body_size 0;
    }
}
