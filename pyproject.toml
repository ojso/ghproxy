[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghproxy"
dynamic = ["version"]
description = "Cache-first proxy for GitHub downloads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
ghproxy = "ghproxy.app:main"

[tool.hatch.version]
path = "src/ghproxy/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
